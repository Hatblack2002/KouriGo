# Utilidad temporal de la Etapa 4: aplica Prettier en CI y commitea la
# corrección. Se dispara manualmente (workflow_dispatch). El agente no
# instala ni ejecuta Prettier en su entorno local (regla ①): el formato se
# corrige aquí, donde la instalación es reproducible y verificable.
# Se puede eliminar cuando ya no sea necesaria.

name: "Corrección de formato (Prettier en CI)"

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: formato
  cancel-in-progress: false

jobs:
  formato:
    name: "Aplicar Prettier y commitear si hay cambios"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalación reproducible
        run: npm ci

      - name: Aplicar Prettier
        run: npm run format:fix

      - name: Mostrar el diff aplicado
        run: git --no-pager diff

      - name: Commitear la corrección si hay cambios
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "KouriGo Agent"
            git config user.email "kourigo-agent@users.noreply.github.com"
            git add -A
            git commit -m "estilo: aplicar prettier (corrección automática en CI)"
            git push
          else
            echo "Sin cambios de formato: el repositorio ya cumple el estilo."
          fi
