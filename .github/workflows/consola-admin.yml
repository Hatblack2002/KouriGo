# KouriGo — Etapa 5: consola administrativa web. Compila el bundle REAL de la
# aplicación (vite build produce el bundle estático sin servidor ni coste) y
# ejecuta la prueba E2E contra el proyecto REAL de Supabase conduciendo los
# módulos reales de la consola y las Edge Functions desplegadas en el
# runtime. Sin secretos la E2E se omite sola; el job de build nunca necesita
# secretos. Ver docs/decisions/ADR-0007-consola-administrativa-web.md.

name: "Consola administrativa (web)"

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "supabase/**"
      - ".github/workflows/consola-admin.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: consola-admin
  cancel-in-progress: false

jobs:
  build:
    name: "Build del bundle (vite build)"
    runs-on: ubuntu-latest
    env:
      CI: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalación reproducible
        run: npm ci

      - name: Compilar paquetes internos
        run: npm run build

      # Valores de marcador SOLO para la compilación: el bundle resultante es
      # evidencia del build real, no un despliegue operativo. La consola
      # exige la configuración pública real al servir el bundle.
      - name: "Compilar el bundle de la consola (estático, sin servidor)"
        env:
          VITE_SUPABASE_URL: "https://marcador-de-compilacion.supabase.co"
          VITE_SUPABASE_ANON_KEY: "marcador-de-compilacion-solo-build"
        run: npm run build --workspace @kourigo/admin

      - name: Subir el bundle como evidencia
        uses: actions/upload-artifact@v4
        with:
          name: bundle-consola-admin
          path: apps/admin/dist
          retention-days: 7

  pruebas-e2e:
    name: "Prueba E2E contra el proyecto real de Supabase"
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalación reproducible
        run: npm ci

      - name: Compilar paquetes internos
        run: npm run build

      - name: Verificar que el proyecto de Supabase responde (salud real)
        run: |
          CODIGO=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/auth/v1/health" || true)
          echo "Salud de Supabase Auth: HTTP ${CODIGO}"
          if [ "$CODIGO" != "200" ]; then
            echo "El proyecto de Supabase no responde en /auth/v1/health" >&2
            exit 1
          fi

      - name: "Prueba E2E: consola administrativa real"
        run: npm test --workspace @kourigo/admin
