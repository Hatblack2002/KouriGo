name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  calidad:
    name: Calidad (formato, lint, tipos y pruebas unitarias)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalación reproducible
        run: npm ci

      - name: Verificación de formato
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Análisis de tipos
        run: npm run typecheck

      - name: Pruebas unitarias
        run: npm run test:unit

  base-de-datos:
    name: Base de datos (migraciones y RLS en PostgreSQL + PostGIS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: kourigo_ci
          POSTGRES_DB: kourigo_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGPASSWORD: kourigo_ci
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar cliente PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Ejecutar migraciones y pruebas de autorización
        run: bash database/tests/run.sh

  build:
    name: Build de paquetes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalación reproducible
        run: npm ci

      - name: Build
        run: npm run build

      - name: Subir artefactos compilados (evidencia)
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: packages/*/dist
          retention-days: 7

  seguridad:
    name: Seguridad (análisis de secretos)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
