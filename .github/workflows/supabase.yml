# KouriGo — Etapa 1.5: migraciones y verificación contra el proyecto real de
# Supabase. Se dispara en cada push a main que toque la base de datos o sus
# runners, y manualmente (workflow_dispatch). La conexión se hace con el
# pooler IPv4 de Supabase (los runners de GitHub Actions no tienen IPv6 para
# la conexión directa).
# Ver docs/decisions/ADR-0003-migraciones-supabase.md.

name: Supabase (proyecto real)

on:
  push:
    branches: [main]
    paths:
      - "database/**"
      - "scripts/**"
      - "supabase/**"
      - ".github/workflows/supabase.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-real
  cancel-in-progress: false

jobs:
  migraciones-y-verificacion:
    name: Aplicar migraciones y verificar esquema/RLS
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar cliente PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Aplicar migraciones pendientes
        run: bash scripts/aplicar_migraciones.sh

      - name: Verificar esquema, RLS y transiciones contra el proyecto real
        run: bash scripts/verificar_supabase.sh

      - name: Configurar Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: "Resolver el host del proyecto (DNS del runner no cubre *.supabase.co)"
        run: |
          HOSTPROYECTO="${SUPABASE_URL#https://}"
          if getent hosts "$HOSTPROYECTO" >/dev/null; then
            echo "El host ya resuelve: $(getent hosts "$HOSTPROYECTO" | head -1)"
            exit 0
          fi
          IP=""
          for RESOLVER in "https://1.1.1.1/dns-query" "https://1.0.0.1/dns-query" \
                          "https://dns.google/resolve" "https://dns.quad9.net/resolve"; do
            IP=$(curl -sS --max-time 10 "${RESOLVER}?name=${HOSTPROYECTO}&type=A" \
              -H "accept: application/dns-json" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); print([a['data'] for a in d.get('Answer', []) if a.get('type')==1][0])" \
              2>/dev/null || true)
            if [ -n "$IP" ]; then
              echo "Resuelto por ${RESOLVER}: ${IP}"
              break
            fi
          done
          if echo "$IP" | grep -Eq '^[0-9]{1,3}(\.[0-9]{1,3}){3}$'; then
            sudo sh -c "printf '%s %s\n' '${IP}' '${HOSTPROYECTO}' >> /etc/hosts"
            getent hosts "$HOSTPROYECTO"
            exit 0
          fi
          echo "DoH sin respuesta; se usa la IP anycast conocida de *.supabase.co (Cloudflare) y se verifica con salud real."
          sudo sh -c "printf '%s %s\n' '172.64.149.246' '${HOSTPROYECTO}' >> /etc/hosts"
          CODIGO=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 15 \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/auth/v1/health" || true)
          if [ "$CODIGO" != "200" ]; then
            echo "El host del proyecto no responde por la IP de respaldo (health: ${CODIGO})" >&2
            exit 1
          fi
          echo "IP de respaldo verificada con health 200."

      - name: Verificación de tipos de las Edge Functions
        run: deno check supabase/functions/

      - name: Pruebas de integración de Edge Functions contra el proyecto real
        run: deno test --allow-all supabase/functions/_pruebas/integracion.test.ts

      - name: Instalar CLI de Supabase
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Desplegar las funciones al runtime de Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          for FUNCION in transicion-pedido despachar-pedido decision-verificacion documento-firmado; do
            supabase functions deploy "$FUNCION" --project-ref ouowxtpntqptsajqgjud
          done

      - name: Verificar que las funciones responden en el runtime
        run: |
          for FUNCION in transicion-pedido despachar-pedido decision-verificacion documento-firmado; do
            CODIGO=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 \
              -X POST "${SUPABASE_URL}/functions/v1/${FUNCION}" \
              -H "Content-Type: application/json" -d '{}' || true)
            echo "${FUNCION}: HTTP ${CODIGO}"
            if [ "$CODIGO" != "401" ]; then
              echo "La función ${FUNCION} no respondió 401 (sin token) en el runtime" >&2
              exit 1
            fi
          done
          echo "Las 4 funciones están desplegadas y exigen JWT en el runtime."
