# KouriGo — Etapa 1.5: migraciones y verificación contra el proyecto real de
# Supabase. Se dispara en cada push a main que toque la base de datos o sus
# runners, y manualmente (workflow_dispatch). La conexión se hace con el
# pooler IPv4 de Supabase (los runners de GitHub Actions no tienen IPv6 para
# la conexión directa).
# Ver docs/decisions/ADR-0003-migraciones-supabase.md.

name: Supabase (proyecto real)

on:
  push:
    branches: [main]
    paths:
      - "database/**"
      - "scripts/**"
      - "supabase/**"
      - ".github/workflows/supabase.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-real
  cancel-in-progress: false

jobs:
  migraciones-y-verificacion:
    name: Aplicar migraciones y verificar esquema/RLS
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar cliente PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Aplicar migraciones pendientes
        run: bash scripts/aplicar_migraciones.sh

      - name: Verificar esquema, RLS y transiciones contra el proyecto real
        run: bash scripts/verificar_supabase.sh

      - name: Configurar Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: "Resolver el host del proyecto (DNS del runner no cubre *.supabase.co)"
        run: |
          HOSTPROYECTO="${SUPABASE_URL#https://}"
          if getent hosts "$HOSTPROYECTO" >/dev/null; then
            echo "El host ya resuelve: $(getent hosts "$HOSTPROYECTO" | head -1)"
            exit 0
          fi
          IP=$(curl -sS "https://1.1.1.1/dns-query?name=${HOSTPROYECTO}&type=A" \
            -H "accept: application/dns-json" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print([a['data'] for a in d.get('Answer', []) if a['type']==1][0])" \
            || true)
          if [ -z "${IP:-}" ]; then
            IP=$(curl -sS "https://dns.google/resolve?name=${HOSTPROYECTO}&type=A" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); print([a['data'] for a in d.get('Answer', []) if a['type']==1][0])")
          fi
          if ! echo "$IP" | rg -q '^[0-9]{1,3}(\.[0-9]{1,3}){3}$'; then
            echo "No se pudo resolver el host del proyecto por DoH" >&2
            exit 1
          fi
          echo "Fijando ${HOSTPROYECTO} -> ${IP} en /etc/hosts"
          sudo sh -c "printf '%s %s\n' '${IP}' '${HOSTPROYECTO}' >> /etc/hosts"
          getent hosts "$HOSTPROYECTO"

      - name: Verificación de tipos de las Edge Functions
        run: deno check supabase/functions/

      - name: Pruebas de integración de Edge Functions contra el proyecto real
        run: deno test --allow-all supabase/functions/_pruebas/integracion.test.ts
